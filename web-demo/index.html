<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de voz</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --muted:#6b7280; --line:#e3e6eb; --accent:#2563eb; --ok:#12805c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:40px auto; padding:0 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; font-size:13px; font-weight:600; margin:0 0 6px; color:#374151; }
  .field { margin-bottom:14px; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; color:inherit; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .row { display:grid; grid-template-columns:1fr 130px; gap:12px; }
  button { width:100%; padding:12px; border:0; border-radius:9px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.07); }
  button:disabled { opacity:.6; cursor:progress; }
  .status { margin:14px 0 0; font-size:13px; color:var(--muted); min-height:19px; }
  .status.ok { color:var(--ok); }
  .status.err { color:#b3261e; }
  .metrics { margin-top:18px; border-top:1px solid var(--line); padding-top:14px; display:none; }
  .metrics.show { display:block; }
  .grid { display:grid; grid-template-columns:1fr auto; gap:7px 16px; font-size:14px; }
  .grid .k { color:var(--muted); }
  .grid .v { font-variant-numeric:tabular-nums; font-weight:600; text-align:right; }
  .text { margin-top:14px; padding:12px; background:#f8fafc; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .text b { display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px; }
</style>
</head>
<body>
<main>
  <h1>Prueba de voz</h1>
  <p class="sub">Escribe el nombre, indica la clínica y presiona reproducir.</p>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="nombre">Nombre del paciente</label>
        <input id="nombre" placeholder="El trozito" autocomplete="off" autofocus>
      </div>
      <div class="field">
        <label for="clinica">Clínica</label>
        <input id="clinica" value="6" inputmode="numeric" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label for="voz">Voz</label>
      <select id="voz">
        <option value="ef_dora">ef_dora (femenina)</option>
        <option value="em_alex">em_alex (masculina)</option>
        <option value="em_santa">em_santa (masculina)</option>
      </select>
    </div>

    <button id="play">Generar y reproducir</button>
    <p id="status" class="status">Listo para otro anuncio.</p>

    <div id="metrics" class="metrics">
      <div class="grid">
        <span class="k">Tiempo total</span><span class="v" id="m-total">—</span>
        <span class="k">Servidor</span><span class="v" id="m-server">—</span>
        <span class="k">Inicio de reproducción</span><span class="v" id="m-play">—</span>
        <span class="k">Tamaño del audio</span><span class="v" id="m-size">—</span>
      </div>
      <div class="text"><b>Texto del anuncio</b><span id="m-text"></span></div>
    </div>
  </div>
</main>

<script>
const API = "http://127.0.0.1:8880/v1/audio/speech";
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), metricsEl = $("metrics"), btn = $("play");

const unidades = ["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez",
  "once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve"];
const decenas = ["","","veinte","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];

function numeroEnLetras(valor) {
  const n = Number(String(valor).trim());
  if (!Number.isInteger(n) || n < 0 || n > 99) return String(valor).trim();
  if (n < 20) return unidades[n];
  const d = Math.floor(n / 10), r = n % 10;
  if (r === 0) return decenas[d];
  if (d === 2) return "veinti" + unidades[r];
  return decenas[d] + " y " + unidades[r];
}

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (kind ? " " + kind : "");
}

let audioActual = null, urlActual = null;

async function generarYReproducir() {
  const nombre = $("nombre").value.trim() || "paciente";
  const clinica = numeroEnLetras($("clinica").value);
  const voz = $("voz").value;
  const texto = `${nombre}, por favor pase a la clínica número ${clinica}.`;

  btn.disabled = true;
  setStatus("Generando audio…");
  $("m-text").textContent = texto;

  if (audioActual) { audioActual.pause(); audioActual = null; }
  if (urlActual) { URL.revokeObjectURL(urlActual); urlActual = null; }

  const t0 = performance.now();
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "kokoro", input: texto, voice: voz, response_format: "wav" })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} del servidor de voz`);

    let blob, tServer, tBlob;
    if (res.body) {
      const reader = res.body.getReader();
      const chunks = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
      }
      tBlob = performance.now();
      tServer = tBlob;
      blob = new Blob(chunks, { type: res.headers.get("content-type") || "audio/wav" });
    } else {
      blob = await res.blob();
      tBlob = performance.now();
      tServer = tBlob;
    }
    if (!blob.size) throw new Error("El servidor devolvió un audio vacío");

    urlActual = URL.createObjectURL(blob);
    audioActual = new Audio(urlActual);
    const tPlay = performance.now();
    await audioActual.play();
    const tPlayOk = performance.now();

    $("m-total").textContent = Math.round(tPlayOk - t0) + " ms";
    $("m-server").textContent = Math.round(tServer - t0) + " ms";
    $("m-play").textContent = Math.round(tPlayOk - tBlob) + " ms";
    $("m-size").textContent = (blob.size / 1024).toFixed(1) + " KB";
    metricsEl.classList.add("show");
    setStatus("Listo para otro anuncio.", "ok");

    audioActual.onended = () => setStatus("Listo para otro anuncio.");
    audioActual.onerror = () => setStatus("No se pudo reproducir el audio.", "err");
  } catch (err) {
    console.error(err);
    metricsEl.classList.add("show");
    $("m-total").textContent = Math.round(performance.now() - t0) + " ms";
    setStatus("Error: " + err.message + ". ¿Está Kokoro en 127.0.0.1:8880?", "err");
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener("click", generarYReproducir);
$("nombre").addEventListener("keydown", (e) => { if (e.key === "Enter") generarYReproducir(); });
$("clinica").addEventListener("keydown", (e) => { if (e.key === "Enter") generarYReproducir(); });
</script>
</body>
</html>
